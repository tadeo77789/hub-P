[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paula-hub"
version = "0.1.0"
description = "Paula Port hub: hexagonal core that turns orders into actions, replies and alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pika",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
